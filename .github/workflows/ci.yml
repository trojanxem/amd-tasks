name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: set up python version
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: install depenedencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: linters
        run: ruff check .
      
      - name: check formatting 
        run: ruff format --check .

      - name: run tests
        run: pytest

      - name: verify race fault detection
        run: |
          set +e

          pytest tests/test_race_condition.py --race-fault
          status=$?

          set -e

          if [ "$status" -eq 1 ]; then
            echo "Race fault detected as expected"
            exit 0
          fi

          if [ "$status" -eq 0 ]; then
            echo "ERROR: Race fault was enabled but not detected"
            exit 1
          fi

        echo "ERROR: Pytest failed unexepctedly with exit code $status."
        exit "$status"
