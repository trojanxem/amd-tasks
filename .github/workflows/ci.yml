name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Code quality
            command: |
              ruff check .
              ruff format --check .

          - name: Unit tests
            command: |
              pytest -v tests/test_inventory_reader.py

          - name: Integration tests
            command: |
              pytest -v tests/integration

          - name: Fault detection
            command: |
              bash scripts/verify_faults.sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ${{ matrix.name }}
        shell: bash
        run: ${{ matrix.command }}
