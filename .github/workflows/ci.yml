name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: set up python version
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: install depenedencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: linters
        run: ruff check .
      
      - name: check formatting 
        run: ruff format --check .

      - name: run tests
        run: pytest
