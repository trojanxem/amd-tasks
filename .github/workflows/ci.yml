name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests (fixed)
        run: python -m pytest -v -s
      - name: Verify fault detection
        run: python -m pytest -v -s tests/verify_faults.py
      - name: Code quality
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          ruff check .
          ruff format --check .
          mypy src tests
