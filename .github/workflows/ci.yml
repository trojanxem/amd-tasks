name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run regression tests
        run: pytest

      - name: Verify race fault detection
        run: |
          set +e

          pytest tests/test_race_condition.py --race-fault
          status=$?

          set -e

          if [ "$status" -eq 1 ]; then
            echo "Race fault detected as expected."
            exit 0
          fi

          if [ "$status" -eq 0 ]; then
            echo "ERROR: Race fault was enabled but not detected."
            exit 1
          fi

          echo "ERROR: Pytest failed unexpectedly with exit code $status."
          exit "$status"
